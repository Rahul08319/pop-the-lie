<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pop the Lie - Fast Math Arcade Game</title>
    <meta name="description" content="Pop balloons with wrong math equations! A fast-paced, brain-sharpening reflex arcade game optimized for YouTube Playables, Facebook Instant Games, Poki, CrazyGames, and modern browsers." />
    <meta name="author" content="Rahul08319" />
    <meta name="theme-color" content="#0066cc" />

    <!-- Apple Web App & Fluid Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pop the Lie" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="Pop the Lie - Fast Math Arcade Game" />
    <meta property="og:description" content="Test your math reflexes! Pop the false equations and protect the truth." />
    <meta property="og:type" content="game" />
    <meta property="og:image" content="./placeholder.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pop the Lie - Fast Math Arcade Game" />
    <meta name="twitter:description" content="Pop balloons with wrong math equations! A fast-paced math reflex arcade game." />

    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        inset: 0;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
        background-color: #0c1017;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <script>
      window.addEventListener('contextmenu', function (e) { e.preventDefault(); }, { passive: false });
    </script>

    <!-- YouTube Playables SDK v1 - MUST be loaded before any game code -->
    <script src="https://www.youtube.com/game_api/v1"></script>
    <script>
      // Safe local fallback stub for offline development and testing
      if (typeof window.ytgame === 'undefined') {
        window.ytgame = {
          IN_PLAYABLES_ENV: false,
          SDK_VERSION: '1.0.0-fallback',
          game: {
            firstFrameReady: function () {},
            gameReady: function () {},
            loadData: function () {
              return Promise.resolve(localStorage.getItem('popTheLie_saveData') || '');
            },
            saveData: function (data) {
              localStorage.setItem('popTheLie_saveData', data);
              return Promise.resolve();
            },
          },
          system: {
            getLanguage: function () {
              return Promise.resolve(navigator.language || 'en');
            },
            isAudioEnabled: function () {
              return true;
            },
            onAudioEnabledChange: function () {
              return function () {};
            },
            onPause: function () {
              return function () {};
            },
            onResume: function () {
              return function () {};
            },
          },
          ads: {
            requestInterstitialAd: function () {
              return Promise.resolve();
            },
            requestRewardedAd: function () {
              return Promise.resolve(true);
            },
          },
          engagement: {
            sendScore: function () {
              return Promise.resolve();
            },
            openYTContent: function () {
              return Promise.resolve();
            },
          },
          health: {
            logError: function () {},
            logWarning: function () {},
          },
        };
      }
    </script>
  </head>

  <body class="bg-[#0c1017] text-white overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
